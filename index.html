weights_hidden_out = np.random.uniform(size=(4, 1))

    hidden_output = sigmoid(hidden_input)

    n = len(arr)
    comparisons = 0
    swaps = 0
    for i in range(n):
        for j in range(0, n-i-1):
            comparisons += 1
            if arr[j] > arr[j+1]:
                arr[j], arr[j+1] = arr[j+1], arr[j]
                swaps += 1
    return arr, comparisons, swaps

def selection_sort(arr):
    n = len(arr)
    comparisons = 0
    swaps = 0
    for i in range(n):
        min_idx = i
        for j in range(i+1, n):
            comparisons += 1
            if arr[j] < arr[min_idx]:
                min_idx = j
        if min_idx != i:
            arr[i], arr[min_idx] = arr[min_idx], arr[i]
            swaps += 1
    return arr, comparisons, swaps

      const [points, setPoints] = useState([]);
      const [lr, setLr] = useState(0.001);
      const [epochs, setEpochs] = useState(100);
      const [m, setM] = useState(0);
      const [c, setC] = useState(0);
      const [mse, setMse] = useState(0);
      const [isTraining, setIsTraining] = useState(false);
      const svgRef = useRef(null);

      // Perform a single step of gradient descent
      const stepGradient = () => {
        if (points.length === 0) return;
        let mGrad = 0;
        let cGrad = 0;
        let N = points.length;
        let totalError = 0;

        for (let p of points) {
          let pred = m * p.x + c;
          let err = p.y - pred;
          totalError += err * err;
          mGrad += -2 * p.x * err;
          cGrad += -2 * err;
        }

        mGrad /= N;
        cGrad /= N;

        const nextM = m - lr * mGrad;
        const nextC = c - lr * cGrad;
        const currentMse = totalError / N;

        setM(nextM);
        setC(nextC);
        setMse(currentMse);
      };

      // Plot point on click
      const handleSvgClick = (e) => {
        if (isTraining) return;
        const rect = svgRef.current.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        // Normalize points coordinates from 0 to 100
        const normX = (clickX / rect.width) * 100;
        const normY = ((rect.height - clickY) / rect.height) * 100; // bottom is Y=0

        setPoints([...points, { x: normX, y: normY }]);
      };

      // Animate epochs sequence
      useEffect(() => {
        if (!isTraining) return;
        if (points.length === 0) {
          setIsTraining(false);
          return;
        }

        let currentEpoch = 0;
        let tempM = m;
        let tempC = c;

        const interval = setInterval(() => {
          if (currentEpoch >= epochs) {
            setIsTraining(false);
            clearInterval(interval);
            return;
          }

          // Single gradient descent step calculation
          let mGrad = 0;
          let cGrad = 0;
          let N = points.length;
          let totalError = 0;

          for (let p of points) {
            let pred = tempM * p.x + tempC;
            let err = p.y - pred;
            totalError += err * err;
            mGrad += -2 * p.x * err;
            cGrad += -2 * err;
          }

          mGrad /= N;
          cGrad /= N;

          tempM = tempM - lr * mGrad;
          tempC = tempC - lr * cGrad;

          setM(tempM);
          setC(tempC);
          setMse(totalError / N);

          currentEpoch++;
        }, 15);

        return () => clearInterval(interval);
      }, [isTraining]);

      const resetSimulator = () => {
        setPoints([]);
        setM(0);
        setC(0);
        setMse(0);
        setIsTraining(false);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

            {/* Control Panel */}
            <div className="md:col-span-1 p-5 bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800 rounded-xl space-y-4 text-xs">
              <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">Regression Config</h5>

              <div className="space-y-1">
                <label className="block text-slate-500 font-semibold">Learning Rate (α): {lr}</label>
                <input
                  type="range"
                  min="0.0001"
                  max="0.01"
                  step="0.0005"
                  value={lr}
                  onChange={(e) => setLr(parseFloat(e.target.value))}
                  disabled={isTraining}
                  className="w-full"
                />
              </div>

              <div className="space-y-1">
                <label className="block text-slate-500 font-semibold">Training Epochs: {epochs}</label>
                <input
                  type="number"
                  min="10"
                  max="1000"
                  value={epochs}
                  onChange={(e) => setEpochs(parseInt(e.target.value) || 100)}
                  disabled={isTraining}
                  className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded"
                />
              </div>

              <div className="pt-2 space-y-2">
                <button
                  onClick={() => setIsTraining(true)}
                  disabled={isTraining || points.length === 0}
                  className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-300 disabled:dark:bg-slate-800 text-white rounded font-bold transition-all"
                >
                  {isTraining ? 'Training...' : 'Run Gradient Descent'}
                </button>

                <button
                  onClick={stepGradient}
                  disabled={isTraining || points.length === 0}
                  className="w-full px-4 py-2 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 rounded font-semibold transition-all"
                >
                  Step (1 Epoch)
                </button>

                <button
                  onClick={resetSimulator}
                  className="w-full px-4 py-2 text-red-600 hover:bg-red-50 dark:hover:bg-red-950/20 rounded font-semibold transition-all"
                >
                  Clear Points
                </button>
              </div>

              <div className="pt-4 border-t space-y-1.5 font-mono text-[11px] text-slate-600 dark:text-slate-400">
                <p>Points Count: {points.length}</p>
                <p>Formula: y = {m.toFixed(4)}x + {c.toFixed(2)}</p>
                <p>MSE Cost: {mse.toFixed(4)}</p>
              </div>
            </div>

            {/* Scatter Graph Canvas */}
            <div className="md:col-span-2 space-y-2">
              <p className="text-xs text-slate-500 dark:text-slate-400">
                💡 <strong>Click inside the grid below</strong> to place coordinate scatter points, then run the algorithm config.
              </p>

              <div className="relative border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden bg-white dark:bg-slate-900 shadow-inner">
                <svg
                  ref={svgRef}
                  onClick={handleSvgClick}
                  className="w-full h-80 cursor-crosshair select-none"
                >
                  {/* Grid Lines */}
                  {[20, 40, 60, 80].map((val) => (
                    <g key={val}>
                      <line x1={`${val}%`} y1="0" x2={`${val}%`} y2="100%" className="stroke-slate-100 dark:stroke-slate-800/50" />
                      <line x1="0" y1={`${val}%`} x2="100%" y2={`${val}%`} className="stroke-slate-100 dark:stroke-slate-800/50" />
                    </g>
                  ))}

                  {/* Regression Line */}
                  {points.length > 0 && (
                    <line
                      x1="0"
                      y1={`${100 - c}%`}
                      x2="100%"
                      y2={`${100 - (m * 100 + c)}%`}
                      className="stroke-red-500"
                      strokeWidth="3.5"
                    />
                  )}

                  {/* Data Points */}
                  {points.map((p, idx) => (
                    <circle
                      key={idx}
                      cx={`${p.x}%`}
                      cy={`${100 - p.y}%`}
                      r="6"
                      className="fill-primary-600 stroke-white dark:stroke-slate-900"
                      strokeWidth="1.5"
                    />
                  ))}
                </svg>
                {points.length === 0 && (
                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-xs text-slate-400 uppercase tracking-widest font-semibold">
                    Grid Empty - Click to add points
                  </div>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────
    // SIMULATOR: K-MEANS CLUSTERING
    // ────────────────────────────────────────────────────────
    function KMeansClusteringSimulator() {
      const [points, setPoints] = useState([]);
      const [k, setK] = useState(3);
      const [centroids, setCentroids] = useState([]);
      const [step, setStep] = useState('initialize'); // initialize, assign, update, converged
      const [iteration, setIteration] = useState(0);
      const svgRef = useRef(null);

      const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#8b5cf6'];

      // Generate random scatter points
      const generateRandomPoints = () => {
        const newPoints = [];
        for (let i = 0; i < 60; i++) {
          newPoints.push({
            x: Math.random() * 90 + 5,
            y: Math.random() * 90 + 5,
            cluster: -1
          });
        }
        setPoints(newPoints);
        setCentroids([]);
        setStep('initialize');
        setIteration(0);
      };

      // Randomly choose K points as initial centroids
      const initializeCentroids = () => {
        if (points.length === 0) return;
        const tempCentroids = [];
        const chosenIndices = new Set();

        while (tempCentroids.length < k && chosenIndices.size < points.length) {
          const idx = Math.floor(Math.random() * points.length);
          if (!chosenIndices.has(idx)) {
            chosenIndices.add(idx);
            tempCentroids.push({
              x: points[idx].x,
              y: points[idx].y
            });
          }
        }
        setCentroids(tempCentroids);
        setStep('assign');
        setIteration(0);
      };

      // Assignment step: assign each point to its nearest centroid
      const assignClusters = () => {
        const updatedPoints = points.map(p => {
          let minDistance = Infinity;
          let closestCluster = -1;

          centroids.forEach((c, idx) => {
            const dist = Math.pow(p.x - c.x, 2) + Math.pow(p.y - c.y, 2); // Squared Euclidean
            if (dist < minDistance) {
              minDistance = dist;
              closestCluster = idx;
            }
          });

          return { ...p, cluster: closestCluster };
        });

        setPoints(updatedPoints);
        setStep('update');
      };

      // Update centroids to the center of gravity of its points
      const updateCentroids = () => {
        let changed = false;
        const updatedCentroids = centroids.map((c, idx) => {
          const clusterPoints = points.filter(p => p.cluster === idx);
          if (clusterPoints.length === 0) return c; // Centroid does not move if empty

          const sumX = clusterPoints.reduce((acc, p) => acc + p.x, 0);
          const sumY = clusterPoints.reduce((acc, p) => acc + p.y, 0);
          const avgX = sumX / clusterPoints.length;
          const avgY = sumY / clusterPoints.length;

          // Check if centroid relocated
          if (Math.abs(c.x - avgX) > 0.1 || Math.abs(c.y - avgY) > 0.1) {
            changed = true;
          }

          return { x: avgX, y: avgY };
        });

        setCentroids(updatedCentroids);
        setIteration(iteration + 1);

        if (!changed) {
          setStep('converged');
        } else {
          setStep('assign');
        }
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

            {/* Control Panel */}
            <div className="md:col-span-1 p-5 bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800 rounded-xl space-y-4 text-xs">
              <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">K-Means Configuration</h5>

              <div className="space-y-1">
                <label className="block text-slate-500 font-semibold">Number of clusters (K): {k}</label>
                <select
                  value={k}
                  onChange={(e) => {
                    setK(parseInt(e.target.value));
                    setCentroids([]);
                    setStep('initialize');
                    setIteration(0);
                  }}
                  className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded text-sm"
                >
                  {[2, 3, 4, 5].map(val => <option key={val} value={val}>K = {val}</option>)}
                </select>
              </div>

              <div className="pt-2 space-y-2">
                <button
                  onClick={generateRandomPoints}
                  className="w-full px-4 py-2 bg-gradient-to-r from-primary-600 to-secondary-500 text-white rounded font-bold transition-all"
                >
                  Generate Random Points
                </button>

                {points.length > 0 && step === 'initialize' && (
                  <button
                    onClick={initializeCentroids}
                    className="w-full px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded font-semibold transition-all"
                  >
                    Initialize Centroids
                  </button>
                )}

                {centroids.length > 0 && step === 'assign' && (
                  <button
                    onClick={assignClusters}
                    className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded font-bold transition-all"
                  >
                    Step 1: Assign Clusters
                  </button>
                )}

                {centroids.length > 0 && step === 'update' && (
                  <button
                    onClick={updateCentroids}
                    className="w-full px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded font-bold transition-all"
                  >
                    Step 2: Update Centroids
                  </button>
                )}
              </div>

              <div className="pt-4 border-t space-y-1.5 font-mono text-[11px] text-slate-600 dark:text-slate-400">
                <p>Status: <span className="uppercase font-bold text-primary-500">{step}</span></p>
                <p>Iterations: {iteration}</p>
                <p>Centroids Plotted: {centroids.length}</p>
              </div>
            </div>

            {/* Clustering Area Canvas */}
            <div className="md:col-span-2 space-y-2">
              <p className="text-xs text-slate-500 dark:text-slate-400">
                💡 Generate random points first, choose your K, and watch centroids migrate step-by-step.
              </p>

              <div className="relative border border-slate-200 dark:border-slate-800 rounded-xl overflow-hidden bg-white dark:bg-slate-900 shadow-inner">
                <svg
                  ref={svgRef}
                  className="w-full h-80 select-none"
                >
                  {/* Grid Lines */}
                  {[20, 40, 60, 80].map((val) => (
                    <g key={val}>
                      <line x1={`${val}%`} y1="0" x2={`${val}%`} y2="100%" className="stroke-slate-100 dark:stroke-slate-800/30" />
                      <line x1="0" y1={`${val}%`} x2="100%" y2={`${val}%`} className="stroke-slate-100 dark:stroke-slate-800/30" />
                    </g>
                  ))}

                  {/* Scatter Points */}
                  {points.map((p, idx) => (
                    <circle
                      key={idx}
                      cx={`${p.x}%`}
                      cy={`${100 - p.y}%`}
                      r="5"
                      fill={p.cluster === -1 ? '#94a3b8' : colors[p.cluster]}
                      className="stroke-white dark:stroke-slate-900"
                      strokeWidth="1"
                    />
                  ))}

                  {/* Centroids represented as Cross Stars */}
                  {centroids.map((c, idx) => (
                    <g key={idx} transform={`translate(${(c.x / 100) * (svgRef.current ? svgRef.current.getBoundingClientRect().width : 400)}, ${svgRef.current ? (svgRef.current.getBoundingClientRect().height - (c.y / 100) * svgRef.current.getBoundingClientRect().height) : 200})`}>
                      <circle r="12" fill={colors[idx]} opacity="0.3" className="animate-ping" />
                      <polygon
                        points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3"
                        fill={colors[idx]}
                        className="stroke-white dark:stroke-slate-900"
                        strokeWidth="1.5"
                      />
                    </g>
                  ))}
                </svg>
                {points.length === 0 && (
                  <div className="absolute inset-0 flex items-center justify-center pointer-events-none text-xs text-slate-400 uppercase tracking-widest font-semibold">
                    Canvas Empty - Click Generate Random Points
                  </div>
                )}
                {step === 'converged' && (
                  <div className="absolute top-3 right-3 bg-emerald-500 text-white text-xs px-2.5 py-1 rounded font-bold uppercase tracking-wider">
                    Converged!
                  </div>
                )}
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────
    // SIMULATOR: SQL TERMINAL PLAYGROUND
    // ────────────────────────────────────────────────────────
    function SQLConsoleSimulator() {
      const [query, setQuery] = useState('SELECT * FROM students WHERE gpa > 3.5');
      const [sqlOutput, setSqlOutput] = useState(null);
      const [sqlError, setSqlError] = useState(null);

      const tableSchemas = {
        students: ['id (INT)', 'name (VARCHAR)', 'age (INT)', 'gpa (FLOAT)', 'major (VARCHAR)'],
        courses: ['course_id (VARCHAR)', 'title (VARCHAR)', 'credits (INT)', 'instructor (VARCHAR)'],
        enrollment: ['student_id (INT)', 'course_id (VARCHAR)', 'grade (VARCHAR)']
      };

      // Mock database compiler
      const runQuery = () => {
        setSqlError(null);
        setSqlOutput(null);

        const q = query.trim().replace(/\s+/g, ' ').toLowerCase();

        if (!q.startsWith('select')) {
          setSqlError('SQL Parse Error: This simulator console only supports SELECT statements.');
          return;
        }

        // Identify table
        let tableName = '';
        if (q.includes('from students')) tableName = 'students';
        else if (q.includes('from courses')) tableName = 'courses';
        else if (q.includes('from enrollment')) tableName = 'enrollment';
        else {
          setSqlError('SQL Table Error: Relation not found. Verify table name (students, courses, enrollment).');
          return;
        }

        // Load dataset
        let dataset = [];
        if (tableName === 'students') {
          dataset = [
            { id: 1, name: 'Alice Smith', age: 19, gpa: 3.8, major: 'AI' },
            { id: 2, name: 'Bob Jones', age: 21, gpa: 3.4, major: 'Data Science' },
            { id: 3, name: 'Charlie Brown', age: 20, gpa: 3.9, major: 'AI' },
            { id: 4, name: 'Diana Prince', age: 22, gpa: 3.1, major: 'Cyber Security' },
            { id: 5, name: 'Ethan Hunt', age: 19, gpa: 3.6, major: 'AI' }
          ];
        } else if (tableName === 'courses') {
          dataset = [
            { course_id: 'CS101', title: 'Python Programming', credits: 4, instructor: 'Dr. Karthikeyan' },
            { course_id: 'CS301', title: 'Data Structures', credits: 4, instructor: 'Dr. Meenakshi' },
            { course_id: 'CS401', title: 'DBMS', credits: 4, instructor: 'Prof. Ramesh' },
            { course_id: 'CS601', title: 'Machine Learning', credits: 4, instructor: 'Dr. Karthikeyan' }
          ];
        } else if (tableName === 'enrollment') {
          dataset = [
            { student_id: 1, course_id: 'CS101', grade: 'A' },
            { student_id: 1, course_id: 'CS301', grade: 'A' },
            { student_id: 2, course_id: 'CS401', grade: 'B' },
            { student_id: 3, course_id: 'CS601', grade: 'A+' },
            { student_id: 4, course_id: 'CS101', grade: 'B+' },
            { student_id: 5, course_id: 'CS301', grade: 'A-' }
          ];
        }

        // Evaluate simple WHERE filters
        if (q.includes('where')) {
          const whereIndex = q.indexOf('where');
          let condition = q.substring(whereIndex + 5).trim();

          if (condition.includes('join')) {
            condition = condition.split('join')[0].trim();
          }
          if (condition.includes('order by')) {
            condition = condition.split('order by')[0].trim();
          }

          try {
            if (condition.includes('gpa >')) {
              const val = parseFloat(condition.split('>')[1]);
              dataset = dataset.filter(r => r.gpa > val);
            } else if (condition.includes('gpa <')) {
              const val = parseFloat(condition.split('<')[1]);
              dataset = dataset.filter(r => r.gpa < val);
            } else if (condition.includes('age >')) {
              const val = parseInt(condition.split('>')[1]);
              dataset = dataset.filter(r => r.age > val);
            } else if (condition.includes('age <')) {
              const val = parseInt(condition.split('<')[1]);
              dataset = dataset.filter(r => r.age < val);
            } else if (condition.includes('major =') || condition.includes('major=')) {
              const val = condition.split('=')[1].replace(/['"]/g, '').trim();
              dataset = dataset.filter(r => r.major.toLowerCase() === val);
            }
          } catch (e) {
            setSqlError('SQL Syntax Error: Unable to process WHERE filter values.');
            return;
          }
        }

        // Evaluate simple inner joins between students and enrollment
        if (q.includes('join')) {
          if (tableName === 'students' && q.includes('join enrollment')) {
            const enroll = [
              { student_id: 1, course_id: 'CS101', grade: 'A' },
              { student_id: 1, course_id: 'CS301', grade: 'A' },
              { student_id: 2, course_id: 'CS401', grade: 'B' },
              { student_id: 3, course_id: 'CS601', grade: 'A+' },
              { student_id: 4, course_id: 'CS101', grade: 'B+' },
              { student_id: 5, course_id: 'CS301', grade: 'A-' }
            ];

            dataset = dataset.flatMap(s => {
              const matches = enroll.filter(e => e.student_id === s.id);
              return matches.map(m => ({
                id: s.id,
                name: s.name,
                gpa: s.gpa,
                course_id: m.course_id,
                grade: m.grade
              }));
            });
          } else {
            setSqlError('SQL Constraint: The demo terminal only supports joining "students" with "enrollment" table.');
            return;
          }
        }

        // Apply column projection
        const selectPart = q.substring(7, q.indexOf('from')).trim();
        if (selectPart !== '*' && selectPart !== '') {
          const columns = selectPart.split(',').map(c => c.trim());
          dataset = dataset.map(row => {
            const projected = {};
            columns.forEach(c => {
              if (row[c] !== undefined) projected[c] = row[c];
              else projected[c] = null;
            });
            return projected;
          });
        }

        setSqlOutput(dataset);
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

            {/* Left: DB Schema Index */}
            <div className="md:col-span-1 p-5 bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800 rounded-xl space-y-4 text-xs">
              <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">Database Schema</h5>

              {Object.keys(tableSchemas).map(tbl => (
                <div key={tbl} className="space-y-1">
                  <span className="font-mono font-bold text-primary-600 dark:text-primary-400 capitalize">{tbl} Table</span>
                  <div className="pl-3 border-l border-slate-300 dark:border-slate-700 font-mono text-[10px] text-slate-500">
                    {tableSchemas[tbl].map(col => <div key={col}>{col}</div>)}
                  </div>
                </div>
              ))}

              <div className="pt-2 border-t space-y-2">
                <button
                  onClick={() => setQuery('SELECT * FROM students')}
                  className="w-full text-left py-1 text-primary-500 font-semibold hover:underline"
                >
                  ⚡ Select all students
                </button>
                <button
                  onClick={() => setQuery('SELECT name, gpa FROM students WHERE gpa > 3.5')}
                  className="w-full text-left py-1 text-primary-500 font-semibold hover:underline"
                >
                  ⚡ Find honors GPA
                </button>
                <button
                  onClick={() => setQuery('SELECT name, course_id, grade FROM students JOIN enrollment')}
                  className="w-full text-left py-1 text-primary-500 font-semibold hover:underline"
                >
                  ⚡ Inner Join Students & grades
                </button>
              </div>
            </div>

            {/* Right: Console Editor & Output */}
            <div className="md:col-span-2 space-y-4">
              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider">SQL Query Editor</label>
                <textarea
                  value={query}
                  onChange={(e) => setQuery(e.target.value)}
                  rows="3"
                  className="w-full px-4 py-3 bg-slate-900 text-emerald-400 font-mono text-sm border border-slate-800 rounded-lg focus:outline-none focus:ring-1 focus:ring-emerald-500"
                />
                <button
                  onClick={runQuery}
                  className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-xs font-bold transition-all shadow flex items-center gap-1.5"
                >
                  <Icons.Play /> Run SQL Query
                </button>
              </div>

              {/* Console Output Table */}
              <div className="space-y-2">
                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider">Query Execution Output</label>

                {sqlError && (

    // ────────────────────────────────────────────────────────
    // SIMULATOR: CPU SCHEDULING INTERACTIVE
    // ────────────────────────────────────────────────────────
    function CPUSchedulingSimulator() {
      const [processes, setProcesses] = useState([
        { id: 'P1', arrival: 0, burst: 6 },
        { id: 'P2', arrival: 1, burst: 4 },
        { id: 'P3', arrival: 2, burst: 2 }
      ]);
      const [algo, setAlgo] = useState('fcfs');
      const [quantum, setQuantum] = useState(2);
      const [results, setResults] = useState(null);

      const addProcess = () => {
        const nextId = `P${processes.length + 1}`;
        setProcesses([
          ...processes,
          { id: nextId, arrival: Math.floor(Math.random() * 5), burst: Math.floor(Math.random() * 8) + 1 }
        ]);
        setResults(null);
      };

      const removeProcess = (idx) => {
        const updated = processes.filter((_, i) => i !== idx);
        setProcesses(updated);
        setResults(null);
      };

      const handleCellChange = (idx, field, val) => {
        const updated = [...processes];
        updated[idx][field] = Math.max(0, parseInt(val) || 0);
        setProcesses(updated);
        setResults(null);
      };

      // Execution schedulers compiler
      const calculateScheduling = () => {
        if (processes.length === 0) return;

        // Copy process profiles
        const jobs = processes.map(p => ({ ...p, remaining: p.burst }));

        let timeline = [];
        let completed = {};
        let t = 0;

        if (algo === 'fcfs') {
          // Sort by arrival
          const sorted = [...jobs].sort((a, b) => a.arrival - b.arrival);
          sorted.forEach(j => {
            if (t < j.arrival) {
              t = j.arrival;
            }
            const start = t;
            const end = t + j.burst;
            timeline.push({ id: j.id, start, end });
            t = end;
            completed[j.id] = {
              turnaround: end - j.arrival,
              waiting: start - j.arrival
            };
          });
        }
        else if (algo === 'sjf') {
          // Non-preemptive Shortest Job First
          let doneCount = 0;
          const totalJobs = jobs.length;

          while (doneCount < totalJobs) {
            const available = jobs.filter(j => j.arrival <= t && !completed[j.id]);

            if (available.length === 0) {
              t++;
              continue;
            }

            // Pick min burst
            available.sort((a, b) => a.burst - b.burst || a.arrival - b.arrival);
            const nextJob = available[0];
            const start = t;
            const end = t + nextJob.burst;

            timeline.push({ id: nextJob.id, start, end });
            t = end;
            completed[nextJob.id] = {
              turnaround: end - nextJob.arrival,
              waiting: start - nextJob.arrival
            };
            doneCount++;
          }
        }
        else if (algo === 'rr') {
          // Round Robin with Quantum
          const queue = [];
          const sorted = [...jobs].sort((a, b) => a.arrival - b.arrival);
          let currentJobIdx = 0;

          // Helper to queue arriving jobs
          const queueArrived = (time) => {
            while (currentJobIdx < sorted.length && sorted[currentJobIdx].arrival <= time) {
              queue.push(sorted[currentJobIdx]);
              currentJobIdx++;
            }
          };

          queueArrived(t);

          while (queue.length > 0 || currentJobIdx < sorted.length) {
            if (queue.length === 0) {
              t++;
              queueArrived(t);
              continue;
            }

            const active = queue.shift();
            const run = Math.min(active.remaining, quantum);
            const start = t;
            const end = t + run;

            timeline.push({ id: active.id, start, end });
            t = end;
            active.remaining -= run;

            // Queue jobs that arrived during execution
            queueArrived(t);

            if (active.remaining > 0) {
              queue.push(active);
            } else {
              completed[active.id] = {
                turnaround: end - active.arrival,
                waiting: end - active.arrival - active.burst
              };
            }
          }
        }

        // Metrics averages
        const keys = Object.keys(completed);
        const avgWaiting = keys.reduce((acc, k) => acc + completed[k].waiting, 0) / keys.length;
        const avgTurnaround = keys.reduce((acc, k) => acc + completed[k].turnaround, 0) / keys.length;

        setResults({ timeline, completed, avgWaiting, avgTurnaround });
      };

      return (
        <div className="space-y-6">
          <div className="grid grid-cols-1 md:grid-cols-3 gap-6">

            {/* Controls */}
            <div className="md:col-span-1 p-5 bg-slate-50 dark:bg-slate-800/30 border border-slate-200 dark:border-slate-800 rounded-xl space-y-4 text-xs">
              <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">Scheduler config</h5>

              <div className="space-y-1">
                <label className="block text-slate-500 font-semibold">Algorithm Choice</label>
                <select
                  value={algo}
                  onChange={(e) => { setAlgo(e.target.value); setResults(null); }}
                  className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded text-sm"
                >
                  <option value="fcfs">First Come First Served (FCFS)</option>
                  <option value="sjf">Shortest Job First (SJF)</option>
                  <option value="rr">Round Robin (RR)</option>
                </select>
              </div>

              {algo === 'rr' && (
                <div className="space-y-1">
                  <label className="block text-slate-500 font-semibold">Time Quantum: {quantum}</label>
                  <input
                    type="number"
                    min="1"
                    max="10"
                    value={quantum}
                    onChange={(e) => { setQuantum(parseInt(e.target.value) || 1); setResults(null); }}
                    className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded"
                  />
                </div>
              )}

              <div className="pt-2 space-y-2">
                <button
                  onClick={calculateScheduling}
                  className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded font-bold transition-all shadow"
                >
                  Simulate Scheduling
                </button>
                <button
                  onClick={addProcess}
                  className="w-full px-4 py-2 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 rounded font-semibold transition-all"
                >
                  Add Process
                </button>
              </div>
            </div>

            {/* Processes profile values */}
            <div className="md:col-span-2 space-y-4">
              <div className="border border-slate-200 dark:border-slate-800 rounded-lg overflow-x-auto bg-white dark:bg-slate-905">
                <table className="w-full text-left font-heading text-xs">
                  <thead className="bg-slate-50 dark:bg-slate-850 border-b text-slate-500 uppercase tracking-widest font-bold">
                    <tr>
                      <th className="px-4 py-2.5">Process</th>
                      <th className="px-4 py-2.5">Arrival Time</th>
                      <th className="px-4 py-2.5">Burst Time</th>
                      <th className="px-4 py-2.5 text-center">Action</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-100 dark:divide-slate-800 font-mono">
                    {processes.map((p, idx) => (
                      <tr key={p.id}>
                        <td className="px-4 py-2 font-bold">{p.id}</td>
                        <td className="px-4 py-2">
                          <input
                            type="number"
                            min="0"

                            onChange={(e) => handleCellChange(idx, 'arrival', e.target.value)}
                            className="w-16 px-1.5 py-1 border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded text-center"
                          />
                        </td>
                        <td className="px-4 py-2">
                          <input
                            type="number"
                            min="1"
                            value={p.burst}
                            onChange={(e) => handleCellChange(idx, 'burst', e.target.value)}
                            className="w-16 px-1.5 py-1 border dark:border-slate-700 bg-slate-50 dark:bg-slate-800 rounded text-center"
                          />
                        </td>
                        <td className="px-4 py-2 text-center">
                          <button
                            onClick={() => removeProcess(idx)}
                            className="text-red-500 hover:text-red-700 font-semibold"
                          >
                            Remove
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              {/* Timeline Gantt Chart Visual */}
              {results && (
                <div className="space-y-4 pt-4 border-t">
                  <h6 className="text-xs font-bold uppercase tracking-wider text-slate-400">Gantt Chart Timeline</h6>
                  <div className="flex border border-slate-200 dark:border-slate-800 rounded-lg overflow-hidden bg-slate-50 dark:bg-slate-900 font-mono text-[11px] h-12 shadow-inner">
                    {results.timeline.map((block, idx) => {
                      const totalSpan = results.timeline[results.timeline.length - 1].end;
                      const widthPercent = ((block.end - block.start) / totalSpan) * 100;
                      return (
                        <div
                          key={idx}
                          style={{ width: `${widthPercent}%` }}
                          className={`h-full border-r border-slate-200 dark:border-slate-800 flex flex-col items-center justify-center text-center ${block.id === 'P1' ? 'bg-blue-100 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300' :
                            block.id === 'P2' ? 'bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-300' :
                              block.id === 'P3' ? 'bg-amber-100 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300' :
                                block.id === 'P4' ? 'bg-purple-100 dark:bg-purple-900/30 text-purple-700 dark:text-purple-300' :
                                  'bg-pink-100 dark:bg-pink-900/30 text-pink-700 dark:text-pink-300'
                            }`}
                        >
                          <span className="font-bold">{block.id}</span>
                          <span className="text-[9px] opacity-75">{block.start}-{block.end}</span>
                        </div>
                      );
                    })}
                  </div>

                  {/* Scheduling metrics display */}
                  <div className="grid grid-cols-2 gap-4 text-xs font-mono pt-2">
                    <div className="p-3 bg-slate-50 dark:bg-slate-900/30 border border-slate-200 dark:border-slate-800 rounded-lg">
                      <p className="text-slate-400">Avg Waiting Time:</p>

                    </div>

        if (isTraining) return;

          if (currentEpoch >= epochs) {

            clearInterval(interval);
            return;
          }
          currentEpoch += 10;
          if (currentEpoch > epochs) currentEpoch = epochs;

          setEpochProgress(currentEpoch);
          const ratio = currentEpoch / epochs;
          const currentLoss = 0.825 * Math.exp(-3 * ratio) + Math.random() * 0.02;
          setLoss(Math.max(0.015, currentLoss));
          setWeights(prev => prev.map(w => w + (Math.random() * 0.1 - 0.05)));
        }, 150);

        setIsTraining(false);
        setLoss(0.825);
        setEpochProgress(0);

          'F-F': { path: ['F'], cost: 0 }
        };

        const key = `${source}-${dest}`;
        if (paths[key]) {
          setActivePath(paths[key].path);
          setTotalCost(paths[key].cost);
        }
      };

      const isEdgeInPath = (fromNode, toNode) => {
        if (activePath.length < 2) return false;
        for (let i = 0; i < activePath.length - 1; i++) {
          const current = activePath[i];
          const next = activePath[i + 1];
          if ((current === fromNode && next === toNode) || (current === toNode && next === fromNode)) {
            return true;
          }
        }
        return false;
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 dark:bg-slate-800/30 p-5 border border-slate-200 dark:border-slate-800 rounded-xl text-xs">
          <div className="md:col-span-1 space-y-4">
            <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">Dijkstra Routing Settings</h5>
            
            <div className="space-y-1">
              <label className="block text-slate-500 font-semibold">Source Node</label>
              <select value={source} onChange={(e) => { setSource(e.target.value); setActivePath([]); setTotalCost(0); }} className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded">
                {Object.keys(nodes).map(n => <option key={n} value={n}>Router {n}</option>)}
              </select>
            </div>

            <div className="space-y-1">
              <label className="block text-slate-500 font-semibold">Destination Node</label>
              <select value={dest} onChange={(e) => { setDest(e.target.value); setActivePath([]); setTotalCost(0); }} className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded">
                {Object.keys(nodes).map(n => <option key={n} value={n}>Router {n}</option>)}
              </select>
            </div>

            <button onClick={findShortestPath} className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded font-bold transition-all shadow">
              Find Shortest Path
            </button>

            {activePath.length > 0 && (
              <div className="p-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-lg space-y-1.5 font-mono text-[11px]">
                <p className="text-slate-400">Optimal Path Routing:</p>
                <p className="text-base font-bold text-primary-500">{activePath.join(' ➔ ')}</p>
                <p className="text-slate-400 pt-1 border-t">Cumulative Path Cost: <strong className="text-slate-700 dark:text-slate-200">{totalCost} ms</strong></p>
              </div>
            )}
          </div>

          <div className="md:col-span-2 space-y-2">
            <p className="text-xs text-slate-500 dark:text-slate-400">
              💡 Dijkstra's algorithm evaluates link costs (numbers adjacent to routes) to find the path with minimum latency. The active path glows in <strong>green</strong>.
            </p>
            <div className="relative border border-slate-200 dark:border-slate-850 rounded-xl overflow-hidden bg-white dark:bg-slate-900 h-64 shadow-inner flex items-center justify-center">
              <svg className="w-full h-full max-w-sm">
                {edges.map((e, idx) => {
                  const p1 = nodes[e.from];
                  const p2 = nodes[e.to];
                  const inPath = isEdgeInPath(e.from, e.to);
                  return (
                    <g key={idx}>
                      <line x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} stroke={inPath ? '#10b981' : '#cbd5e1'} strokeWidth={inPath ? '4' : '2'} className="transition-all" />
                      <rect x={(p1.x + p2.x) / 2 - 8} y={(p1.y + p2.y) / 2 - 8} width="16" height="16" rx="3" className="fill-slate-100 dark:fill-slate-800 stroke-slate-200 dark:stroke-slate-700" />
                      <text x={(p1.x + p2.x) / 2} y={(p1.y + p2.y) / 2 + 4} textAnchor="middle" className="text-[9px] font-mono fill-slate-500 dark:fill-slate-400 font-bold">{e.cost}</text>
                    </g>
                  );
                })}

                {Object.keys(nodes).map(n => {
                  const node = nodes[n];
                  const isEndpoint = n === source || n === dest;
                  const isMidPath = activePath.includes(n);
                  let strokeColor = 'stroke-slate-400';
                  let fillColor = 'fill-white dark:fill-slate-900';

                  if (isEndpoint) {
                    strokeColor = 'stroke-primary-500';
                    fillColor = 'fill-primary-500/10';
                  } else if (isMidPath) {
                    strokeColor = 'stroke-emerald-500';
                    fillColor = 'fill-emerald-500/10';
                  }

                  return (
                    <g key={n} transform={`translate(${node.x}, ${node.y})`}>
                      <circle r="15" className={`${fillColor} ${strokeColor}`} strokeWidth="2.5" />
                      <text textAnchor="middle" y="4" className="text-[10px] font-mono font-bold fill-slate-800 dark:fill-slate-100">{n}</text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        </div>
      );
    }

      const [stats, setStats] = useState(null);

      const runImputation = () => {
        const validAges = dataset.filter(r => r.age !== null).map(r => r.age);
        const meanAge = Math.round(validAges.reduce((a, b) => a + b, 0) / validAges.length);

        const validGPAs = dataset.filter(r => r.gpa !== null).map(r => r.gpa);
        const meanGPA = parseFloat((validGPAs.reduce((a, b) => a + b, 0) / validGPAs.length).toFixed(2));

        const updated = dataset.map(row => ({

          gpa: row.gpa === null ? meanGPA : row.gpa,

        setDataset(updated);
        setImputed(true);
      };

      const calculateStatistics = () => {
        if (!imputed) return;

        const ageVariance = ages.reduce((acc, a) => acc + Math.pow(a - meanAge, 2), 0) / ages.length;

        setStats({ meanAge, meanGPA, ageStd });

        setDataset(initialData);

    // ────────────────────────────────────────────────────────
    // SIMULATOR: DESIGN & ANALYSIS OF ALGORITHMS
    // ────────────────────────────────────────────────────────
    function SortingAlgorithmSimulator() {
      const [arr, setArr] = useState([45, 12, 85, 32, 60, 18, 92, 54, 38, 70, 22, 65, 8, 48, 80]);
      const [algo, setAlgo] = useState('Bubble');
      const [activeIndices, setActiveIndices] = useState([]);
      const [isSorting, setIsSorting] = useState(false);
      const [comparisonCount, setComparisonCount] = useState(0);

      const generateRandom = () => {
        if (isSorting) return;
        const newArr = Array.from({ length: 15 }, () => Math.floor(Math.random() * 90) + 10);
        setArr(newArr);
        setActiveIndices([]);
        setComparisonCount(0);
      };

      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      const runBubbleSort = async () => {
        setIsSorting(true);
        let tempArr = [...arr];
        let comps = 0;
        for (let i = 0; i < tempArr.length - 1; i++) {
          for (let j = 0; j < tempArr.length - i - 1; j++) {
            if (!isSorting) return;
            setActiveIndices([j, j + 1]);
            comps++;
            setComparisonCount(comps);
            await sleep(150);
            if (tempArr[j] > tempArr[j + 1]) {
              let swap = tempArr[j];
              tempArr[j] = tempArr[j + 1];
              tempArr[j + 1] = swap;
              setArr([...tempArr]);
            }
          }
        }
        setActiveIndices([]);
        setIsSorting(false);
      };

      const runSelectionSort = async () => {
        setIsSorting(true);
        let tempArr = [...arr];
        let comps = 0;
        for (let i = 0; i < tempArr.length - 1; i++) {
          let minIdx = i;
          for (let j = i + 1; j < tempArr.length; j++) {
            if (!isSorting) return;
            setActiveIndices([i, j, minIdx]);
            comps++;
            setComparisonCount(comps);
            await sleep(150);
            if (tempArr[j] < tempArr[minIdx]) {
              minIdx = j;
            }
          }
          if (minIdx !== i) {
            let swap = tempArr[i];
            tempArr[i] = tempArr[minIdx];
            tempArr[minIdx] = swap;
            setArr([...tempArr]);
          }
        }
        setActiveIndices([]);
        setIsSorting(false);
      };

      const triggerSort = () => {
        if (isSorting) {
          setIsSorting(false);
          setActiveIndices([]);
          return;
        }
        if (algo === 'Bubble') runBubbleSort();
        else runSelectionSort();
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 dark:bg-slate-800/30 p-5 border border-slate-200 dark:border-slate-800 rounded-xl text-xs">
          <div className="md:col-span-1 space-y-4">
            <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">Sorting Config</h5>
            
            <div className="space-y-1">
              <label className="block text-slate-500 font-semibold">Algorithm Choice</label>
              <select value={algo} onChange={(e) => setAlgo(e.target.value)} disabled={isSorting} className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded">
                <option value="Bubble">Bubble Sort (O(N^2))</option>
                <option value="Selection">Selection Sort (O(N^2))</option>
              </select>
            </div>

            <div className="pt-2 space-y-2">
              <button onClick={triggerSort} className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded font-bold transition-all shadow">
                {isSorting ? 'Stop Animation' : 'Run Sorting Simulation'}
              </button>
              <button onClick={generateRandom} disabled={isSorting} className="w-full px-4 py-2 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-850 text-slate-700 dark:text-slate-300 rounded font-semibold transition-all">
                Shuffle Array
              </button>
            </div>

            <div className="pt-4 border-t space-y-1.5 font-mono text-[11px]">
              <p>Array Length: {arr.length} nodes</p>
              <p>Total Comparisons: <strong className="text-primary-500">{comparisonCount}</strong></p>
            </div>
          </div>

          <div className="md:col-span-2 space-y-2">
            <p className="text-xs text-slate-500 dark:text-slate-400">
              💡 Visualizing index comparisons. Active elements under swap analysis glow in <strong>red</strong>.
            </p>
            <div className="relative border border-slate-200 dark:border-slate-855 rounded-xl bg-white dark:bg-slate-900 h-64 shadow-inner flex items-end justify-between p-6 gap-1">
              {arr.map((val, idx) => {
                const isActive = activeIndices.includes(idx);
                return (
                  <div key={idx} className="flex flex-col items-center flex-1">
                    <div style={{ height: `${val * 1.6}px` }} className={`w-full rounded-t transition-all ${isActive ? 'bg-red-500' : 'bg-primary-500 opacity-80'}`} />
                    <span className="text-[9px] font-mono text-slate-400 mt-1">{val}</span>
                  </div>
                );
              })}
            </div>
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────
    // SIMULATOR: BIG DATA MAPREDUCE EXECUTOR
    // ────────────────────────────────────────────────────────
    function MapReduceSimulator() {
      const [inputLines, setInputLines] = useState("big data analysis\ndata exploration visual\nbig data systems");
      const [mapOutput, setMapOutput] = useState([]);
      const [shuffleOutput, setShuffleOutput] = useState({});
      const [reduceOutput, setReduceOutput] = useState([]);
      const [step, setStep] = useState(0);

      const runSimulation = async () => {
        setStep(1);
        const words = inputLines.toLowerCase().split(/\s+/).filter(w => w.length > 0);
        const mapList = words.map(w => ({ key: w, val: 1 }));
        setMapOutput(mapList);
        await sleep(1000);

        setStep(2);
        const shuffled = {};
        mapList.forEach(item => {
          if (!shuffled[item.key]) shuffled[item.key] = [];
          shuffled[item.key].push(1);
        });
        setShuffleOutput(shuffled);
        await sleep(1000);

        setStep(3);
        const reduced = Object.keys(shuffled).map(k => ({
          key: k,
          count: shuffled[k].length
        })).sort((a, b) => b.count - a.count);
        setReduceOutput(reduced);
      };

      const reset = () => {
        setStep(0);
        setMapOutput([]);
        setShuffleOutput({});
        setReduceOutput([]);
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 dark:bg-slate-800/30 p-5 border border-slate-200 dark:border-slate-800 rounded-xl text-xs">
          <div className="md:col-span-1 space-y-4">
            <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">MapReduce Input</h5>
            
            <div className="space-y-1">
              <label className="block text-slate-500 font-semibold">Source Sentences</label>
              <textarea value={inputLines} onChange={(e) => setInputLines(e.target.value)} rows="3" disabled={step > 0} className="w-full px-2 py-1.5 border dark:border-slate-700 bg-white dark:bg-slate-800 rounded font-mono text-[11px]" />
            </div>

            <div className="pt-2 space-y-2">
              <button onClick={runSimulation} disabled={step > 0} className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-350 text-white rounded font-bold transition-all shadow">
                Run MapReduce Job
              </button>
              <button onClick={reset} className="w-full px-4 py-2 border border-slate-300 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-850 text-slate-700 dark:text-slate-300 rounded font-semibold transition-all">
                Reset
              </button>
            </div>

            <div className="pt-4 border-t space-y-1.5 font-mono text-[10px] text-slate-505">
              <p>Job State: <strong className="uppercase text-primary-500">{step === 0 ? 'Idle' : step === 1 ? 'Mapping' : step === 2 ? 'Shuffling' : 'Completed'}</strong></p>
            </div>
          </div>

          <div className="md:col-span-2 space-y-4 flex flex-col justify-between">
            <p className="text-xs text-slate-500 dark:text-slate-400">
              💡 Watch how input sentences split into <strong>Map</strong> pairs, group during <strong>Shuffle</strong>, and sum final frequencies in the <strong>Reduce</strong> step.
            </p>

            <div className="space-y-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-xl shadow-inner min-h-[160px] max-h-[220px] overflow-y-auto font-mono text-[10px]">
              {step === 0 && <div className="text-slate-400 text-center py-8">Enter text and start cluster simulation</div>}
              
              {step >= 1 && (
                <div className="space-y-1">
                  <h6 className="font-sans font-bold text-slate-400 uppercase tracking-widest text-[9px]">Stage 1: Mapper Output</h6>
                  <div className="flex flex-wrap gap-1">
                    {mapOutput.map((item, idx) => (
                      <span key={idx} className="px-2 py-0.5 bg-blue-50 dark:bg-blue-900/30 text-blue-700 dark:text-blue-300 border border-blue-200 rounded">
                        ({item.key}, 1)
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {step >= 2 && (
                <div className="space-y-1 pt-3 border-t">
                  <h6 className="font-sans font-bold text-slate-400 uppercase tracking-widest text-[9px]">Stage 2: Shuffled Nodes</h6>
                  <div className="flex flex-wrap gap-2">
                    {Object.keys(shuffleOutput).map(k => (
                      <span key={k} className="px-2 py-0.5 bg-amber-50 dark:bg-amber-900/30 text-amber-700 dark:text-amber-300 border border-amber-200 rounded">
                        {k} ➔ [{shuffleOutput[k].join(', ')}]
                      </span>
                    ))}
                  </div>
                </div>
              )}

              {step >= 3 && (
                <div className="space-y-1 pt-3 border-t">
                  <h6 className="font-sans font-bold text-slate-400 uppercase tracking-widest text-[9px]">Stage 3: Reducer Aggregates</h6>
                  <div className="grid grid-cols-3 gap-2">
                    {reduceOutput.map(item => (
                      <div key={item.key} className="px-2 py-1 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-300 border border-emerald-200 rounded font-bold text-center">
                        {item.key}: {item.count}
                      </div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────
    // SIMULATOR: CLOUD ARCHITECTURE LOAD TESTER
    // ────────────────────────────────────────────────────────
    function CloudArchitectureSimulator() {
      const [infra, setInfra] = useState([]);
      const [traffic, setTraffic] = useState('Idle');
      const [cost, setCost] = useState(0);

      const addNode = (type) => {
        const costConfig = { EC2: 15, RDS: 28, S3: 8, ALB: 12 };
        const id = `${type}-${infra.filter(n => n.type === type).length + 1}`;
        setInfra([...infra, { id, type, status: 'Healthy', load: 0 }]);
        setCost(prev => prev + costConfig[type]);
      };

      const simulateTraffic = () => {
        if (infra.length === 0) return;
        setTraffic('Running');

        setInfra(prev => prev.map(node => {
          if (node.type === 'EC2') {
            const hasALB = prev.some(n => n.type === 'ALB');
            const loadVal = hasALB ? 35 : 85;
            return {
              ...node,
              load: loadVal,
              status: loadVal > 80 ? 'High Load' : 'Healthy'
            };
          }
          return node;
        }));
      };

      const clearInfra = () => {
        setInfra([]);
        setTraffic('Idle');
        setCost(0);
      };

      return (
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 bg-slate-50 dark:bg-slate-800/30 p-5 border border-slate-200 dark:border-slate-800 rounded-xl text-xs">
          <div className="md:col-span-1 space-y-4">
            <h5 className="font-bold text-slate-700 dark:text-slate-300 uppercase tracking-wider border-b pb-2">Infrastructure Panel</h5>
            
            <div className="grid grid-cols-2 gap-2">
              <button onClick={() => addNode('EC2')} className="px-2 py-1.5 bg-slate-800 text-white rounded font-bold hover:bg-slate-750">
                + EC2 VM
              </button>
              <button onClick={() => addNode('RDS')} className="px-2 py-1.5 bg-slate-800 text-white rounded font-bold hover:bg-slate-750">
                + RDS Database
              </button>
              <button onClick={() => addNode('S3')} className="px-2 py-1.5 bg-slate-800 text-white rounded font-bold hover:bg-slate-750">
                + S3 Bucket
              </button>
              <button onClick={() => addNode('ALB')} className="px-2 py-1.5 bg-slate-800 text-white rounded font-bold hover:bg-slate-750">
                + ALB Balancer
              </button>
            </div>

            <div className="pt-2 space-y-2">
              <button onClick={simulateTraffic} className="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 text-white rounded font-bold transition-all shadow">
                Simulate Load Test
              </button>
              <button onClick={clearInfra} className="w-full px-4 py-2 border border-slate-300 dark:border-slate-700 hover:bg-slate-105 text-slate-700 dark:text-slate-300 rounded font-semibold transition-all">
                Terminate Infrastructure
              </button>
            </div>

            <div className="pt-4 border-t space-y-1.5 font-mono text-[11px]">
              <p>Node count: {infra.length} instances</p>
              <p>Est. Monthly Bill: <strong className="text-primary-500">${cost} / month</strong></p>
            </div>
          </div>

          <div className="md:col-span-2 space-y-2 flex flex-col justify-between">
            <p className="text-xs text-slate-500 dark:text-slate-400">
              💡 Cloud architecture topology. Adding an <strong>ALB Load Balancer</strong> prevents single EC2 compute instances from hitting warning <strong>High Load</strong> levels.
            </p>

            <div className="relative border border-slate-200 dark:border-slate-850 rounded-xl bg-white dark:bg-slate-900 min-h-[160px] shadow-inner p-4 flex flex-wrap gap-4 items-center justify-center">
              {infra.length === 0 ? (
                <span className="text-slate-400 uppercase tracking-widest text-[9px] font-bold font-mono">No nodes provisioned</span>
              ) : (
                infra.map(node => (
                  <div key={node.id} className="p-3 border rounded-xl flex flex-col items-center gap-1.5 min-w-[90px] text-center shadow bg-slate-50 dark:bg-slate-800 border-slate-200 dark:border-slate-700 transition-colors">
                    <span className="text-2xl">
                      {node.type === 'EC2' ? '💻' : node.type === 'RDS' ? '💾' : node.type === 'S3' ? '🪣' : '⚖️'}
                    </span>
                    <div>
                      <p className="font-bold text-[10px] text-slate-800 dark:text-slate-200 leading-none">{node.id}</p>
                      <p className={`text-[9px] font-semibold mt-1 px-1.5 py-0.5 rounded-full ${node.status === 'Healthy' ? 'bg-emerald-100 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400' : 'bg-amber-100 dark:bg-amber-900 text-amber-600 dark:text-amber-400'}`}>
                        {node.status}
                      </p>
                      {node.type === 'EC2' && node.load > 0 && (
                        <p className="text-[9px] text-slate-400 font-mono mt-1">CPU: {node.load}%</p>
                      )}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

            <div className="flex items-center justify-between bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-4 rounded-2xl shadow-sm text-xs font-semibold">
              <button 
                onClick={() => navigateTo('labs')}
                className="px-4 py-2 border dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg transition-all"
              >
                ← Back to Courses List
              </button>
              
              <div className="flex gap-2">
                <button 
                  onClick={prevTopic} 
                  disabled={topicIndex === 0} 
                  className="px-4 py-2 border dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-800 rounded-lg disabled:opacity-50 transition-all"
                >
                  Previous Topic
                </button>
                <button 
                  onClick={nextTopic} 
                  disabled={topicIndex === totalTopics - 1} 
                  className="px-4 py-2 bg-primary-600 hover:bg-primary-750 text-white rounded-lg disabled:opacity-50 transition-all shadow-sm"
                >
                  Next Topic
                </button>
              </div>
            </div>

          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────
    // COMPONENT: SELF-ASSESSMENT QUIZ
    // ────────────────────────────────────────────────────────
    function LabQuizComponent({ quizQuestions }) {
      const [answers, setAnswers] = useState({});
      const [submitted, setSubmitted] = useState(false);
      const [score, setScore] = useState(0);

      const handleOptionSelect = (qIdx, oIdx) => {
        if (submitted) return;
        setAnswers({ ...answers, [qIdx]: oIdx });
      };

      const checkScore = () => {
        let correctCount = 0;
        quizQuestions.forEach((q, idx) => {
          if (answers[idx] === q.a) correctCount++;
        });
        setScore(correctCount);
        setSubmitted(true);
      };

      const resetQuiz = () => {
        setAnswers({});
        setSubmitted(false);
        setScore(0);
      };

      return (
        <div className="space-y-6">
          <div className="flex items-center justify-between border-b pb-3">
            <h4 className="text-lg font-heading font-bold text-slate-800 dark:text-slate-100">Self-Assessment Test</h4>
            {submitted && (
              <span className="px-3 py-1 bg-primary-100 dark:bg-primary-955 text-primary-600 dark:text-primary-400 text-xs font-bold rounded-full">
                Score: {score} / {quizQuestions.length}
              </span>
            )}
          </div>

          <div className="space-y-6">
            {quizQuestions.map((q, idx) => (
              <div key={idx} className="space-y-3 p-4 bg-slate-50 dark:bg-slate-900/30 border border-slate-200 dark:border-slate-800 rounded-xl text-xs transition-colors">
                <p className="font-heading font-bold text-slate-800 dark:text-slate-200 text-sm leading-relaxed">
                  Q{idx + 1}. {q.q}
                </p>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                  {q.o.map((opt, oIdx) => {
                    const isSelected = answers[idx] === oIdx;
                    const isCorrectOption = q.a === oIdx;

                    let btnClass = 'border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 hover:bg-slate-50';
                    if (isSelected) {
                      btnClass = 'bg-primary-50 dark:bg-primary-950/40 border-primary-500 text-primary-600 dark:text-primary-400';
                    }
                    if (submitted) {
                      if (isCorrectOption) {
                        btnClass = 'bg-emerald-50 dark:bg-emerald-950/30 border-emerald-500 text-emerald-600 dark:text-emerald-400 font-semibold';
                      } else if (isSelected) {
                        btnClass = 'bg-red-50 dark:bg-red-955 border-red-500 text-red-600 dark:text-red-400';
                      } else {
                        btnClass = 'opacity-60 border border-slate-200 dark:border-slate-800';
                      }
                    }

                    return (
                      <button
                        key={oIdx}
                        onClick={() => handleOptionSelect(idx, oIdx)}
                        disabled={submitted}
                        className={`text-left px-4 py-2.5 rounded-lg transition-all ${btnClass}`}
                      >
                        {opt}
                      </button>
                    );
                  })}
                </div>

                {submitted && (
                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-2 italic leading-relaxed border-t pt-2">
                    💡 Explanation: {q.exp}
                  </p>
                )}
              </div>
            ))}
          </div>

          <div className="flex gap-4 items-center justify-end border-t pt-4">
            {!submitted ? (
              <button
                onClick={checkScore}
                disabled={Object.keys(answers).length < quizQuestions.length}
                className="px-6 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-slate-300 disabled:dark:bg-slate-800 text-white rounded text-xs font-bold transition-all shadow"
              >
                Submit Answers
              </button>
            ) : (
              <button
                onClick={resetQuiz}
                className="px-6 py-2 bg-slate-850 hover:bg-slate-750 text-white rounded text-xs font-bold transition-all"
              >
                Reset Test
              </button>
            )}
          </div>
        </div>
      );
    }

    // ────────────────────────────────────────────────────────
    // React Render Call
    // ────────────────────────────────────────────────────────
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>

</html>
