server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: virtuallab-backend

  # Database configuration (Defaults to H2 for easy zero-setup run, easily switched to Postgres)
  datasource:
    url: jdbc:h2:mem:virtuallabdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# JWT Security Configuration
app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 Hours
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173"

# OpenAPI Swagger configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
